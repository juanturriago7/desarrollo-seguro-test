# El sitio no necesita compilarse. El "build" se limita a copiar a dist/ solo lo que
# debe publicarse, de forma que el material de estudio de docs/ nunca llegue a internet.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir -p dist && cp index.html dist/ && cp -r src data dist/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
